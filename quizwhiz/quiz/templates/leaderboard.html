<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — QuizWhiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="container">
        <a class="back-link" href="/">← Back</a>

        <div class="page-header">
            <div class="page-title">Leaderboard</div>
            <div class="page-sub">Top performers across all quizzes</div>
        </div>

        <div class="table-header">
            <span style="text-align:center">#</span>
            <span>Player</span>
            <span style="text-align:right">Score</span>
            <span style="text-align:right">Pct</span>
        </div>

        <ul id="leaderboard-list">
            <div class="loading-state">Loading leaderboard<span>_</span></div>
        </ul>
    </div>

    <script>
        fetch('/api/leaderboard/')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';

                if (!data.length) {
                    list.innerHTML = '<div class="loading-state">No entries yet. Be the first!</div>';
                    return;
                }

                data.forEach((p, i) => {
                    const rank = i + 1;
                    const li = document.createElement('li');
                    li.className = `lb-row${rank <= 3 ? ` rank-${rank}` : ''}`;
                    li.style.animationDelay = `${i * 0.05}s`;

                    const medal = rank === 1 ? '①' : rank === 2 ? '②' : rank === 3 ? '③' : rank;

                    // #1 gets a crown prefix on their name
                    const nameHtml = rank === 1
                        ? `<span class="lb-crown">${p.username}</span>`
                        : p.username;

                    li.innerHTML = `
                        <div class="lb-rank">${medal}</div>
                        <div class="lb-name">${nameHtml}</div>
                        <div class="lb-score">${p.score}/${p.total_questions}</div>
                        <div class="lb-pct">${p.percentage}%</div>
                        <div class="lb-feedback">${p.feedback}</div>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('leaderboard-list').innerHTML =
                    '<div class="loading-state">Failed to load leaderboard.</div>';
            });
    </script>
</body>
</html>
