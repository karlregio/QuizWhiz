<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — QuizWhiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c14;
            --surface: #111520;
            --border: #1e2540;
            --gold: #f0b429;
            --gold-dim: #a87d1a;
            --text: #e8eaf0;
            --muted: #6b7280;
            --rank1: #f0b429;
            --rank2: #9ca3af;
            --rank3: #b45309;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(240,180,41,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(240,180,41,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 24px 80px;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--gold); }

        .page-header {
            margin-bottom: 48px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .page-sub {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 48px 1fr auto auto;
            gap: 16px;
            padding: 10px 20px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            margin-bottom: 2px;
        }

        #leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .lb-row {
            display: grid;
            grid-template-columns: 48px 1fr auto auto;
            gap: 16px;
            align-items: center;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            opacity: 0;
            transform: translateX(-12px);
            animation: slideIn 0.35s forwards;
            transition: border-color 0.2s;
        }

        .lb-row:hover {
            border-color: var(--gold-dim);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .lb-row.rank-1 { border-left: 3px solid var(--rank1); }
        .lb-row.rank-2 { border-left: 3px solid var(--rank2); }
        .lb-row.rank-3 { border-left: 3px solid var(--rank3); }

        .lb-rank {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
        }

        .lb-row.rank-1 .lb-rank { color: var(--rank1); }
        .lb-row.rank-2 .lb-rank { color: var(--rank2); }
        .lb-row.rank-3 .lb-rank { color: var(--rank3); }

        .lb-name {
            font-size: 14px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-score {
            font-size: 13px;
            color: var(--muted);
            text-align: right;
            white-space: nowrap;
        }

        .lb-pct {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
            min-width: 52px;
        }

        .lb-row.rank-1 .lb-pct { color: var(--rank1); }

        .lb-feedback {
            grid-column: 2 / -1;
            font-size: 11px;
            color: var(--muted);
            padding-top: 4px;
            letter-spacing: 0.3px;
        }

        .loading-state {
            color: var(--muted);
            font-size: 13px;
            padding: 32px 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="/">← Back</a>

        <div class="page-header">
            <div class="page-title">Leaderboard</div>
            <div class="page-sub">Top performers across all quizzes</div>
        </div>

        <div class="table-header">
            <span style="text-align:center">#</span>
            <span>Player</span>
            <span style="text-align:right">Score</span>
            <span style="text-align:right">Pct</span>
        </div>

        <ul id="leaderboard-list">
            <div class="loading-state">Loading leaderboard<span style="animation:blink 1s step-end infinite;display:inline-block">_</span></div>
        </ul>
    </div>

    <style>@keyframes blink { 50% { opacity: 0; } }</style>

    <script>
        fetch('/api/leaderboard/')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';

                if (!data.length) {
                    list.innerHTML = '<div class="loading-state">No entries yet. Be the first!</div>';
                    return;
                }

                data.forEach((p, i) => {
                    const rank = i + 1;
                    const li = document.createElement('li');
                    li.className = `lb-row${rank <= 3 ? ` rank-${rank}` : ''}`;
                    li.style.animationDelay = `${i * 0.05}s`;

                    const medal = rank === 1 ? '①' : rank === 2 ? '②' : rank === 3 ? '③' : rank;

                    li.innerHTML = `
                        <div class="lb-rank">${medal}</div>
                        <div class="lb-name">${p.username}</div>
                        <div class="lb-score">${p.score}/${p.total_questions}</div>
                        <div class="lb-pct">${p.percentage}%</div>
                        <div class="lb-feedback">${p.feedback}</div>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('leaderboard-list').innerHTML =
                    '<div class="loading-state">Failed to load leaderboard.</div>';
            });
    </script>
</body>
</html>
