<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard — QuizWhiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>
  <body>
    <div class="container">
      <a class="back-link" href="/">← Back</a>

      <div class="page-header">
        <div class="page-title">Leaderboard</div>
        <div class="page-sub">Top performers across all quizzes</div>
      </div>

      <select
        id="category-filter"
        class="lb-filter"
        onchange="loadLeaderboard()"
      >
        <option value="">All Categories</option>
      </select>

      <div class="lb-table-header">
        <span style="text-align: center">#</span>
        <span>Player</span>
        <span style="text-align: right">Score</span>
        <span style="text-align: right">Pct</span>
        <span style="text-align: right">Time</span>
      </div>

      <ul id="leaderboard-list">
        <div class="loading-state">Loading leaderboard<span>_</span></div>
      </ul>
    </div>

    <script>
      function loadCategories() {
        fetch("/api/categories/")
          .then((res) => res.json())
          .then((data) => {
            const select = document.getElementById("category-filter");

            data.forEach((cat) => {
              const option = document.createElement("option");
              option.value = cat.id;
              option.textContent = cat.name;
              select.appendChild(option);
            });
          });
      }

      function loadLeaderboard() {
        const category = document.getElementById("category-filter").value;

        let url = "/api/leaderboard/";
        if (category) {
          url += `?category=${category}`;
        }

        fetch(url)
          .then((res) => res.json())
          .then((data) => {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";

            if (!data.length) {
              list.innerHTML =
                '<div class="loading-state">No entries yet. Be the first!</div>';
              return;
            }

            data.forEach((p, i) => {
              const rank = i + 1;
              const li = document.createElement("li");

              li.className = `lb-row${rank <= 3 ? ` rank-${rank}` : ""}`;
              li.style.animationDelay = `${i * 0.05}s`;

              const medal =
                rank === 1 ? "①" : rank === 2 ? "②" : rank === 3 ? "③" : rank;

              const nameHtml =
                rank === 1
                  ? `<span class="lb-crown">${p.username}</span>`
                  : p.username;

              li.innerHTML = `
            <div class="lb-rank">${medal}</div>
            <div class="lb-name">
                ${nameHtml}
                <div class="lb-sub">
                    ${p.quiz_title} • ${p.feedback}
                </div>
            </div>
            <div class="lb-score">${p.score}/${p.total_questions}</div>
            <div class="lb-pct">${Number(p.percentage).toFixed(0)}%</div>
            <div class="lb-time">${p.time_taken ?? "—"}s</div>
          `;

              list.appendChild(li);
            });
          })
          .catch(() => {
            document.getElementById("leaderboard-list").innerHTML =
              '<div class="loading-state">Failed to load leaderboard.</div>';
          });
      }

      // LOAD BOTH ON PAGE START
      document.addEventListener("DOMContentLoaded", () => {
        loadCategories();
        loadLeaderboard();
      });
    </script>
  </body>
</html>
