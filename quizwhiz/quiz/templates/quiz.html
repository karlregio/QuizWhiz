<!DOCTYPE html>
<html>
<head>
    <title>Take Quiz</title>
</head>
<body>
    <h2 id="quiz-title">Loading...</h2>

    <form id="quiz-form"></form>

    <br>
    <input type="text" id="username" placeholder="Enter your name">
    <button type="button" onclick="submitQuiz()">Submit Quiz</button>

    <script>
        // ✅ GET CSRF TOKEN FROM COOKIE
        function getCSRFToken() {
            let cookieValue = null;
            const cookies = document.cookie.split(';');

            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();

                if (cookie.startsWith('csrftoken=')) {
                    cookieValue = cookie.substring('csrftoken='.length);
                    break;
                }
            }

            return cookieValue;
        }

        const params = new URLSearchParams(window.location.search);
        const quizId = params.get('id');

        if (!quizId) {
            document.getElementById('quiz-title').innerText = 'Quiz not found.';
        } else {
            fetch(`/api/quizzes/${quizId}/`)
                .then(res => res.json())
                .then(data => {
                    console.log("QUIZ DATA:", data);

                    document.getElementById('quiz-title').innerText = data.title;

                    const form = document.getElementById('quiz-form');
                    form.innerHTML = '';

                    data.questions.forEach(q => {
                        let html = `<p>${q.text}</p>`;

                        q.choices.forEach(c => {
                            html += `
                                <label>
                                    <input type="radio" name="q${q.id}" value="${c.id}">
                                    ${c.text}
                                </label><br>
                            `;
                        });

                        form.innerHTML += html;
                    });
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('quiz-title').innerText = 'Error loading quiz.';
                });
        }

        function submitQuiz() {
            const username = document.getElementById('username').value.trim();

            if (!username) {
                alert('Enter your name');
                return;
            }

            const answers = [];

            document.querySelectorAll('input[type=radio]:checked')
                .forEach(input => {
                    answers.push({
                        question_id: parseInt(input.name.replace('q', '')),
                        choice_id: parseInt(input.value)
                    });
                });

            fetch(`/api/quizzes/${quizId}/submit/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()   // ✅ FIXED
                },
                body: JSON.stringify({
                    username: username,
                    answers: answers
                })
            })
            .then(res => res.json())
            .then(data => {
                console.log("SUBMIT RESPONSE:", data);

                if (data.error) {
                    alert(data.error);
                    return;
                }

                localStorage.setItem('quiz_result', JSON.stringify(data));
                window.location.href = "/result/";
            })
            .catch(err => {
                console.error(err);
                alert("Submit failed");
            });
        }
    </script>
</body>
</html>
