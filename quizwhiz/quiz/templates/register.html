<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — QuizWhiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">

        <div class="auth-brand">
            <span class="auth-brand-logo">QuizWhiz</span>
            <span class="auth-brand-tag">v2.0</span>
        </div>

        <div class="auth-heading">Create Account</div>
        <div class="auth-sub">Join and start taking quizzes</div>

        {% if error %}
        <div class="auth-error">
            <span class="auth-error-icon">!</span>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="auth-field">
                <label class="field-label" for="username">Username</label>
                <input class="text-input" type="text" id="username" name="username"
                    placeholder="Choose a username" autocomplete="username" required>
            </div>

            <div class="auth-field">
                <label class="field-label" for="password">Password</label>
                <input class="text-input" type="password" id="password" name="password"
                    placeholder="Choose a password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="submit-btn">Register →</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="/login/">Sign in</a>
        </div>

    </div>
</div>
</body>
</html>
