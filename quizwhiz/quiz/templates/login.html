<!doctype html>
<html>
  <head>
    <title>Login</title>
  </head>
  <body>
    <h2>Login</h2>

    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <input name="username" placeholder="Username" required /><br /><br />
      <input
        name="password"
        type="password"
        placeholder="Password"
        required
      /><br /><br />
      <button type="submit">Login</button>
    </form>

    <p>No account? <a href="/register/">Register</a></p>
  </body>
</html>
