<!DOCTYPE html>
<html>
<head>
    <title>QuizWhiz</title>
</head>
<body>
    <h1>Available Quizzes</h1>
    <ul id="quiz-list"></ul>

    <script>
        fetch('/api/quizzes/')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('quiz-list');
                list.innerHTML = '';

                data.forEach(q => {
                    list.innerHTML += `
                        <li>
                            ${q.title}
                            <a href="/quiz/?id=${q.id}">Take Quiz</a>
                        </li>
                    `;
                });
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
